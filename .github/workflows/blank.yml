name: Build AutoParry JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "project.zip"
      - ".github/workflows/blank.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q project.zip -d project
          echo "=== Extracted files ==="
          find project -maxdepth 5 -type f | sort

      - name: Find Gradle project
        shell: bash
        run: |
          BUILD_FILE="$(find project -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "Cannot find build.gradle or build.gradle.kts"
            find project -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Gradle project: $PROJECT_DIR"
          echo "Build file: $BUILD_FILE"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1"

      - name: Build JAR
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: List build output
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          echo "=== JAR files ==="
          find build/libs -type f -name "*.jar" -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: autoparry-jar
          path: $ {{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
